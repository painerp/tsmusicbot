[package]
name = "tsmusicbot"
version = "0.2.0"
description = "A TeamSpeak3 music bot."
edition = "2018"

[dependencies]
audiopus = "0.3.0-rc.0"
serde = "1.0.217"
serde_json = "1.0.135"
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib" }
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib" }
anyhow = "1.0.95"
futures = "0.3.31"
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "time", "signal", "process"] }
log = "0.4.22"
env_logger = "0.11.6"
which = "8.0.6"
axum = "0.8.9"
chrono = "0.4.39"
socketioxide = "0.18.7"

[dependencies.slog]
version = "2.7.0"
features = ["max_level_trace", "release_max_level_info"]

[dev-dependencies]
tokio = { version = "1.42.0", features = ["io-util", "macros", "net", "rt-multi-thread", "rt", "signal", "test-util"] }